<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>达妮娅桌宠设置</title>
<style>body{margin:0;background:#141a29;color:#e9eef8;font:16px 'Microsoft YaHei',sans-serif}main{max-width:650px;margin:24px auto;padding:24px}h1{font-size:28px}p{color:#abbad0;line-height:1.8}section{background:#20293b;padding:20px;border-radius:14px;margin:16px 0}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #405272;background:#141a29;color:#e9eef8;margin:5px}button{cursor:pointer;background:#354766}button:hover{background:#4d628a}label{display:block;margin:8px 0}input[type=number]{width:90px}input[type=range]{width:min(90%,300px)}#message{color:#a7dfca;min-height:24px}</style>
<main><h1>达妮娅桌宠设置</h1><section><button id="form">切换形态</button><span id="formName"></span><p>各形态使用自己的待机和动作，互不混播。</p></section><section><label><input id="quiet" type="checkbox" checked>安静模式</label><p id="mode">开启：本形态安静待机，点击随机播放一个动作，播完回到待机。</p></section>
<section><label>大小 <input id="scale" type="range" min="160" max="1280" step="10" value="640"></label><label>画布宽度 <input id="size" type="number" min="160" max="1280" step="10" value="640"> px</label><p>拖动滑杆实时等比缩放，大小自动保存。也可右键角色选择“调整大小”。</p></section>
<p id="message" role="status"></p><button id="exit">退出桌宠</button></main>
<script>const $=id=>document.getElementById(id);function modeText(){$('mode').textContent=$('quiet').checked?'开启：本形态安静待机，点击随机播放一个动作，播完回到待机。':'关闭：像 dsh-pet 一样随机播放待机、转向、移动和其他动作。'}async function post(path,data){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();$('message').textContent=d.ok?'已应用':d.reason;return d}catch(e){$('message').textContent='连接失败：'+e.message}}
let formId='original';const forms={original:'原服装',bandage:'缠布条',star:'星空'};function showForm(id){formId=id;$('formName').textContent='当前：'+forms[id]}$('form').onclick=async()=>{const ids=Object.keys(forms);const next=ids[(ids.indexOf(formId)+1)%ids.length];const d=await post('/api/settings',{formId:next});if(d?.ok)showForm(next)};$('quiet').onchange=async()=>{const selected=$('quiet').checked;const d=await post('/api/settings',{quietMode:selected});if(!d?.ok)$('quiet').checked=!selected;modeText()};let sizeTimer;let sizeQueue=Promise.resolve();function saveSize(){clearTimeout(sizeTimer);const value=Number($('size').value);sizeTimer=setTimeout(()=>{sizeQueue=sizeQueue.then(()=>post('/api/settings',{size:value}))},100)}$('scale').oninput=()=>{$('size').value=$('scale').value;saveSize()};$('size').oninput=()=>{$('scale').value=$('size').value;saveSize()};$('exit').onclick=()=>post('/shutdown',{});
fetch('/dsh-pet-7340/config').then(r=>r.json()).then(d=>{$('size').value=$('scale').value=d.main.pets[0].size;$('quiet').checked=d.main.pets[0].quietMode;showForm(d.main.pets[0].formId||'original');modeText()});setInterval(()=>fetch('/dsh-pet-7340/command').then(r=>r.json()).then(d=>{if(d.formId)showForm(d.formId);if(typeof d.quietMode==='boolean'){$('quiet').checked=d.quietMode;modeText()}}).catch(()=>{}),1000);
</script></html>
